# The dsh-google-vertex bundle patch: applied automatically when a profile
# lists this bundle. Users override this row from their profile's own
# cordis.patch.yml (live-watched; dsh.profile.bundles is frozen at boot) with a
# `- id: google-vertex` row, which replaces the row's whole `config`.
#
# One row registers two routes:
#   google-vertex-anthropic — Google-hosted Claude (publishers/anthropic)
#   google-vertex-gemini    — Gemini (publishers/google)
- insert:
    - id: google-vertex
      name: 'dsh-google-vertex'
      config:
        # Service-account JSON path ('~' allowed). Left unset here so the
        # $GOOGLE_APPLICATION_CREDENTIALS fallback applies; a deployment that
        # keeps the file elsewhere overrides this row with the path. Mount
        # fails loudly when neither is set.
        # serviceAccountFile: ~/.secrets/your-service-account.json
        # Google Cloud project. Optional: falls back to $GOOGLE_CLOUD_PROJECT,
        # $GCLOUD_PROJECT, then the credentials file's own project_id.
        # project: my-project
        # Region for both Vertex endpoints, or 'global' (default) for
        # aiplatform.googleapis.com. Optional: falls back to
        # $GOOGLE_CLOUD_LOCATION. Claude is not servable in every region.
        # location: us-east5
        # Claude model ids, replacing the built-in catalog.
        # models:
        #   - claude-sonnet-4-5
        # Gemini model ids, replacing the built-in catalog.
        # geminiModels:
        #   - gemini-3.5-flash
        #   - gemini-2.5-pro
        # Claude context window and output cap reported for every model.
        # contextWindow: 200000
        # maxTokens: 32000
